<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление фильма - Кинозал</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/control-films-add.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="admin-container">
    <a href="/admin/control-films" class="back-link">← Назад</a>

    <div class="admin-header">
        <h1>Добавление фильма</h1>
        <p class="admin-subtitle">Заполните информацию о новом фильме</p>
    </div>

    <div class="form-container">
        <form class="form-card" id="addFilmForm" action="/admin/control-films-add" method="post" enctype="multipart/form-data">

            <!-- Название -->
            <div class="form-group">
                <label for="title">
                    Название фильма
                    <span class="required">*</span>
                </label>
                <input type="text"
                       id="title"
                       name="title"
                       class="form-control"
                       placeholder="Введите название фильма"
                       required>
            </div>

            <!-- Описание -->
            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description"
                          name="description"
                          class="form-control textarea"
                          placeholder="Введите описание фильма"></textarea>
            </div>

            <!-- Две колонки: жанр и длительность -->
            <div class="form-row">
                <div class="form-group">
                    <label for="genre">Жанр</label>
                    <input type="text"
                           id="genre"
                           name="genre"
                           class="form-control"
                           placeholder="Например: фантастика, драма">
                </div>

                <div class="form-group">
                    <label for="duration">Длительность (мин)</label>
                    <input type="number"
                           id="duration"
                           name="duration"
                           class="form-control"
                           placeholder="120"
                           min="1">
                </div>
            </div>

            <!-- Две колонки: возраст и год -->
            <div class="form-row">
                <div class="form-group">
                    <label for="ageRating">Возрастной рейтинг</label>
                    <input type="text"
                           id="ageRating"
                           name="ageRating"
                           class="form-control"
                           placeholder="Например: 18+, 12+, 6+">
                </div>
            </div>

            <!-- Постер -->
            <div class="form-group">
                <label for="posterFileInput">Постер <span class="required">*</span></label>
                <div class="upload-area" onclick="document.getElementById('posterFileInput').click()">
                    <span class="icon">📁</span>
                    <p>Нажмите для выбора файла постера</p>
                    <p style="font-size: 12px; color: #666;">Поддерживаются: JPG, PNG, WEBP (макс. 5MB)</p>
                    <input type="file"
                           id="posterFileInput"
                           name="posterFile"
                           class="file-input"
                           accept="image/*"
                           required>
                </div>
                <div id="posterFileName" style="color: #888; font-size: 14px; margin-top: 8px;"></div>
                <div class="poster-preview" id="posterPreview">
                    <img id="posterPreviewImage" src="" alt="Превью постера">
                </div>
            </div>

            <!-- Бэкдроп -->
            <div class="form-group">
                <label for="backdropFileInput">Бэкдроп (фоновое изображение)</label>
                <div class="upload-area" onclick="document.getElementById('backdropFileInput').click()">
                    <span class="icon">🖼️</span>
                    <p>Нажмите для выбора фонового изображения</p>
                    <p style="font-size: 12px; color: #666;">Поддерживаются: JPG, PNG, WEBP (макс. 5MB)</p>
                    <input type="file"
                           id="backdropFileInput"
                           name="backdropFile"
                           class="file-input"
                           accept="image/*">
                </div>
                <div id="backdropFileName" style="color: #888; font-size: 14px; margin-top: 8px;"></div>
                <div class="poster-preview" id="backdropPreview">
                    <img id="backdropPreviewImage" src="" alt="Превью бэкдропа">
                </div>
            </div>

            <!-- Активен (по умолчанию true) -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox"
                           id="active"
                           name="active"
                           checked
                           value="true">
                    <label for="active">Фильм активен</label>
                </div>
            </div>

            <!-- Кнопки -->
            <div class="form-actions">
                <button type="submit" class="btn-save">Добавить фильм</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    // Превью загруженного изображения
    document.addEventListener('DOMContentLoaded', function() {
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('posterPreview');
        const previewImage = document.getElementById('previewImage');
        const fileName = document.getElementById('fileName');

        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                // Показываем имя файла
                fileName.textContent = '📎 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';

                // Превью
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    preview.classList.add('visible');
                };
                reader.readAsDataURL(file);
            } else {
                fileName.textContent = '';
                preview.classList.remove('visible');
                previewImage.src = '';
            }
        });

        // Автоматическое обновление превью при вводе URL
        const posterUrl = document.getElementById('posterUrl');
        posterUrl.addEventListener('input', function() {
            const url = this.value.trim();
            if (url) {
                previewImage.src = url;
                preview.classList.add('visible');
            } else {
                // Если есть загруженный файл, не убираем превью
                if (!fileInput.files.length) {
                    preview.classList.remove('visible');
                    previewImage.src = '';
                }
            }
        });
    });
    document.addEventListener('DOMContentLoaded', function() {

        // === Логика для постера ===
        const posterFileInput = document.getElementById('posterFileInput');
        const posterPreview = document.getElementById('posterPreview');
        const posterPreviewImage = document.getElementById('posterPreviewImage');
        const posterFileName = document.getElementById('posterFileName');

        posterFileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                // Проверка размера (макс. 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert('Файл слишком большой! Максимальный размер 5MB');
                    this.value = '';
                    posterFileName.textContent = '';
                    posterPreview.classList.remove('visible');
                    posterPreviewImage.src = '';
                    return;
                }

                posterFileName.textContent = '📎 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
                const reader = new FileReader();
                reader.onload = function(e) {
                    posterPreviewImage.src = e.target.result;
                    posterPreview.classList.add('visible');
                };
                reader.readAsDataURL(file);
            } else {
                posterFileName.textContent = '';
                posterPreview.classList.remove('visible');
                posterPreviewImage.src = '';
            }
        });

        // === Логика для бэкдропа ===
        const backdropFileInput = document.getElementById('backdropFileInput');
        const backdropPreview = document.getElementById('backdropPreview');
        const backdropPreviewImage = document.getElementById('backdropPreviewImage');
        const backdropFileName = document.getElementById('backdropFileName');

        backdropFileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                // Проверка размера (макс. 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    alert('Файл слишком большой! Максимальный размер 5MB');
                    this.value = '';
                    backdropFileName.textContent = '';
                    backdropPreview.classList.remove('visible');
                    backdropPreviewImage.src = '';
                    return;
                }

                backdropFileName.textContent = '📎 ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' KB)';
                const reader = new FileReader();
                reader.onload = function(e) {
                    backdropPreviewImage.src = e.target.result;
                    backdropPreview.classList.add('visible');
                };
                reader.readAsDataURL(file);
            } else {
                backdropFileName.textContent = '';
                backdropPreview.classList.remove('visible');
                backdropPreviewImage.src = '';
            }
        });

        // === Отправка формы ===
        const form = document.getElementById('addFilmForm');
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                // Проверка: выбран ли файл постера
                if (!posterFileInput.files.length) {
                    alert('Пожалуйста, выберите файл постера');
                    return;
                }

                const formData = new FormData(this);

                // Показываем индикатор загрузки (опционально)
                const submitBtn = form.querySelector('.btn-save');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Загрузка...';
                submitBtn.disabled = true;

                fetch('/admin/control-films-add', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Ошибка сервера: ' + response.status);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.success) {
                            window.location.href = '/admin/control-films';
                        } else {
                            alert('Ошибка: ' + (data.message || 'Неизвестная ошибка'));
                            submitBtn.textContent = originalText;
                            submitBtn.disabled = false;
                        }
                    })
                    .catch(error => {
                        console.error('Ошибка:', error);
                        alert('Произошла ошибка при добавлении фильма: ' + error.message);
                        submitBtn.textContent = originalText;
                        submitBtn.disabled = false;
                    });
            });
        }
    });
</script>

</body>
</html>
