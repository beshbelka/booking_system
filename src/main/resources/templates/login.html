<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинозал - Вход</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1 class="login-title">Вход в аккаунт</h1>
            <p class="login-subtitle">Войдите, чтобы покупать билеты онлайн</p>
        </div>

        <form class="login-form" action="#" method="post" id="loginForm">
            <div class="form-group">
                <label for="email" class="form-label">Электронная почта</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="example@mail.ru" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember" class="checkbox-input">
                    <span class="checkbox-text">Запомнить меня</span>
                </label>
                <a href="#" class="forgot-link">Забыли пароль?</a>
            </div>

            <button type="submit" class="btn-login">Войти</button>

            <div class="register-link">
                Нет аккаунта? <a href="/auth/registration" class="register-link-text">Зарегистрируйтесь</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        // Показываем кнопку загрузки
        const btn = document.getElementById('loginBtn');
        const originalText = btn.textContent;
        btn.textContent = 'Вход...';
        btn.disabled = true;

        // Скрываем предыдущие ошибки
        document.getElementById('errorMessage').style.display = 'none';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                const data = await response.json();

                // Сохраняем токен в cookie
                document.cookie = `token=${data.accessToken}; path=/; max-age=86400`;

                // Редирект на профиль
                window.location.href = '/profile';
            } else {
                // Показываем ошибку
                document.getElementById('errorMessage').style.display = 'block';
                btn.textContent = originalText;
                btn.disabled = false;
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('errorMessage').textContent = '❌ Ошибка соединения с сервером';
            document.getElementById('errorMessage').style.display = 'block';
            btn.textContent = originalText;
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
