<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление фильмами - Кинозал</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/control-films.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="admin-container">
    <a href="/admin/control" class="back-link">← Назад</a>

    <div class="admin-header">
        <h1>Управление фильмами</h1>
        <p class="admin-subtitle">Список всех фильмов в системе</p>
    </div>

    <div class="movies-management-header">
        <div th:text="'Всего фильмов: ' + ${#lists.size(movies)}" style="color: #888; font-size: 16px;">
            Всего фильмов: 0
        </div>
        <a href="/admin/control-films-add" class="btn-add">+ Добавить фильм</a>
    </div>

    <!-- Таблица с фильмами -->
    <div th:if="${not #lists.isEmpty(movies)}">
        <table class="movies-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Постер</th>
                <th>Название</th>
                <th>Жанр</th>
                <th>Длительность</th>
                <th>Возрастное ограничение</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movie : ${movies}">
                <td th:text="${movie.id}">0</td>
                <td class="poster-cell">
                    <img th:src="${movie.posterUrl != null && movie.posterUrl != '' ? movie.posterUrl : '/images/no-image.jpg'}"
                         th:alt="${movie.title}">
                </td>
                <td class="title-cell" th:text="${movie.title}">Название</td>
                <td th:text="${movie.genre}">Жанр</td>
                <td th:text="${movie.formattedDuration}">2ч 30мин</td>
                <td th:text="${movie.ageRating}">18+</td>
                <td class="actions-cell">
                    <button class="btn-edit"
                            th:data-id="${movie.id}"
                            th:data-title="${movie.title}"
                            th:if="${movie.active}"
                            type="button">
                        Редактировать
                    </button>
                    <button class="btn-delete"
                            th:data-id="${movie.id}"
                            th:data-title="${movie.title}"
                            th:if="${movie.active}"
                            type="button">
                        Удалить
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Пустое состояние -->
    <div th:if="${#lists.isEmpty(movies)}" class="empty-state">
        <h3>Нет добавленных фильмов</h3>
        <p>Нажмите кнопку "Добавить фильм", чтобы создать первый фильм в системе.</p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // === УДАЛЕНИЕ ===
        const deleteButtons = document.querySelectorAll('.btn-delete');

        deleteButtons.forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();

                const movieId = this.getAttribute('data-id');
                const movieTitle = this.getAttribute('data-title');

                if (!confirm(`Вы уверены, что хотите удалить фильм "${movieTitle}"?`)) {
                    return;
                }

                fetch('/admin/control-films-delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ id: movieId })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('Фильм успешно удален!');
                            location.reload();
                        } else {
                            alert('Ошибка: ' + (data.message || 'Неизвестная ошибка'));
                        }
                    })
                    .catch(error => {
                        console.error('Ошибка:', error);
                        alert('Произошла ошибка при удалении фильма.');
                    });
            });
        });

        // === РЕДАКТИРОВАНИЕ ===
        const editButtons = document.querySelectorAll('.btn-edit');

        editButtons.forEach(button => {
            button.addEventListener('click', function (e) {
                e.preventDefault();
                const movieId = this.getAttribute('data-id');
                window.location.href = '/admin/control-films-edit?movieId=' + movieId;
            });
        });
    });
</script>

</body>
</html>
