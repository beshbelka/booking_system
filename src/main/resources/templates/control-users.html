<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление фильмами - Кинозал</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/control-films.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="admin-container">
    <a href="/admin/control" class="back-link">← Назад</a>

    <div class="admin-header">
        <h1>Управление пользователями</h1>
        <p class="admin-subtitle">Список всех пользователей в системе</p>
    </div>

    <div class="movies-management-header">
        <div th:text="'Всего пользователей: ' + ${#lists.size(users)}" style="color: #888; font-size: 16px;">
            Всего пользователей: 0
        </div>
    </div>

    <!-- Таблица с пользователями -->
    <div th:if="${not #lists.isEmpty(users)}">
        <table class="movies-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Имя</th>
                <th>Дата рождения</th>
                <th>Количество броней</th>
                <th>Роль</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">0</td>
                <td th:text="${user.email}"></td>
                <td class="title-cell" th:text="${user.name}"></td>
                <td th:text="${user.birthDate}"></td>
                <td th:text="${user.books.size}"></td>
                <td th:text="${user.role}"></td>
                <td class="actions-cell">
                    <button th:if="${user.role.name() != 'ADMIN'}"
                            class="btn-delete"
                            th:data-id="${user.id}"
                            th:data-title="${user.name}"
                            type="button">
                        Удалить
                    </button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Пустое состояние -->
    <div th:if="${#lists.isEmpty(users)}" class="empty-state">
        <h3>Нет добавленных пользователей</h3>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Находим все кнопки удаления
        const deleteButtons = document.querySelectorAll('.btn-delete');

        deleteButtons.forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();

                // Получаем данные из data-атрибутов
                const userId = this.getAttribute('data-id');
                const userName = this.getAttribute('data-title');

                // Показываем подтверждение
                const confirmMessage = `Вы уверены, что хотите удалить пользователя "${userName}"?`;
                if (!confirm(confirmMessage)) {
                    return;
                }

                // Отправляем запрос на сервер
                fetch('/admin/control-users-delete', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ id: userId })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('Пользователь успешно удален!');
                            location.reload();
                        } else {
                            alert('Ошибка: ' + (data.message || 'Неизвестная ошибка'));
                        }
                    })
                    .catch(error => {
                        console.error('Ошибка:', error);
                        alert('Произошла ошибка при удалении пользователя.');
                    });
            });
        });
    });
</script>

</body>
</html>
