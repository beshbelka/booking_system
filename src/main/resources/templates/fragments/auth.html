<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<!-- Кнопка открытия -->
<button class="open-btn" onclick="openModal()">Войти / Зарегистрироваться</button>

<!-- Модальное окно -->
<div th:fragment="authModal" class="modal" id="authModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">×</button>

        <div class="modal-header">
            <div class="modal-logo">КИНОЗАЛ</div>
            <p class="modal-subtitle" id="modalSubtitle">Войдите, чтобы продолжить</p>
        </div>

        <div class="modal-body">
            <div class="error-message" id="errorMessage"></div>

            <form id="authForm" onsubmit="return handleSubmit(event)">
                <!-- Общее поле: Email/Логин -->
                <div class="form-group">
                    <label>Email</label>
                    <input type="text" id="email" placeholder="example@mail.ru" required>
                </div>

                <!-- Общее поле: Пароль -->
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <!-- Дополнительные поля для регистрации -->
                <div id="registerFields" style="display: none;">
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" id="name" placeholder="Иван">
                    </div>

                    <div class="form-group">
                        <label>Дата рождения</label>
                        <input type="date" id="birthDate">
                    </div>

                    <div class="form-group">
                        <label>Подтверждение пароля</label>
                        <input type="password" id="confirmPassword" placeholder="••••••••">
                    </div>

                </div>

                <!-- Опции (только для входа) -->
                <div class="form-options" id="loginOptions">
                    <label class="checkbox">
                        <input type="checkbox" id="remember">
                        <span>Запомнить меня</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="return false;">Забыли пароль?</a>
                </div>

                <!-- Кнопка отправки -->
                <button type="submit" class="btn-login" id="submitBtn">Войти</button>
            </form>

            <!-- Переключение режимов -->
            <div class="register-link" id="switchBlock">
                <span id="switchText">Нет аккаунта?</span>
                <a href="#" id="switchLink" onclick="toggleMode(); return false;">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>

<script src="js/modal.js"></script>
</body>
</html>
