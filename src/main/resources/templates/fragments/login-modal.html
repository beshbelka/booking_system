<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="loginModal" class="modal" id="loginModal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeLoginModal()">×</button>

        <div class="modal-header">
            <div class="modal-logo">КИНОЗАЛ</div>
            <p class="modal-subtitle">Войдите, чтобы продолжить</p>
        </div>

        <div class="modal-body">
            <div class="error-message" id="modalErrorMessage"></div>

            <form id="modalLoginForm" onsubmit="return handleModalLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="modalEmail" placeholder="example@mail.ru" required>
                </div>

                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="modalPassword" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="modalRemember">
                        <span>Запомнить меня</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="return false;">Забыли пароль?</a>
                </div>

                <button type="submit" class="btn-login">Войти</button>
            </form>

            <div class="register-link">
                Нет аккаунта? <a href="#" onclick="alert('Регистрация'); return false;">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>
</html>
