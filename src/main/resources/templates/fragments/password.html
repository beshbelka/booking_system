<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="passwordModal">
    <!-- Модальное окно смены пароля -->
    <div class="modal-overlay" id="passwordModal">
        <div class="modal">
            <button class="modal-close" onclick="closePasswordModal()">&times;</button>
            <h2 class="modal-title">Смена пароля</h2>

            <form id="passwordForm" onsubmit="changePassword(event)">
                <div class="modal-form-group">
                    <label>Текущий пароль</label>
                    <input type="password" id="oldPassword" required>
                </div>
                <div class="modal-form-group">
                    <label>Новый пароль</label>
                    <input type="password" id="newPassword" required minlength="6">
                </div>
                <div class="modal-form-group">
                    <label>Подтверждение</label>
                    <input type="password" id="confirmPassword" required>
                </div>

                <div class="modal-error" id="modalError"></div>
                <div class="modal-success" id="modalSuccess">Пароль успешно изменён!</div>

                <button type="submit" class="modal-btn">Сохранить</button>

                <span class="modal-forgot-link" onclick="forgotPassword()">Забыли пароль?</span>
            </form>
        </div>
    </div>
</div>
</html>
