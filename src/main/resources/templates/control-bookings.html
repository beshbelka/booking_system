<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление бронированиями - Кинозал</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/control-bookings.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="admin-container">
    <a href="/admin/control" class="back-link">← Назад</a>

    <div class="admin-header">
        <h1>Управление бронированиями</h1>
        <p class="admin-subtitle">Просмотр и управление бронированиями</p>
    </div>

    <!-- Форма фильтрации -->
    <div class="filter-form">
        <div class="filter-group">
            <label for="filmSelect">Фильм</label>
            <select id="filmSelect" class="form-select">
                <option value="0">Все фильмы</option>
            </select>
        </div>

        <button class="btn-find" id="findBookingsBtn">🔍 Найти</button>
    </div>

    <!-- Заголовок результатов -->
    <div class="results-header">
        <span class="results-count" id="resultsCount">Найдено бронирований: 0</span>
    </div>

    <!-- Таблица с бронированиями -->
    <!-- Таблица с бронированиями -->
    <div class="table-wrapper">
        <table class="bookings-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Фильм</th>
                <th>Email пользователя</th>
                <th>Места</th>
                <th>ID сеанса</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody id="bookingsTableBody">
            <tr class="empty-row">
                <td colspan="7">
                    <div class="empty-state">
                        <h3>Нет бронирований</h3>
                        <p>Бронирований не найдено.</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/control-bookings.js}"></script>
</body>
</html>
