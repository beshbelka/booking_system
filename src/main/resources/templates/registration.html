<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинозал - Регистрация</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/registration.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="registration-container">
    <div class="registration-card">
        <div class="registration-header">
            <h1 class="registration-title">Создать аккаунт</h1>
            <p class="registration-subtitle">Присоединяйтесь к Кинозалу</p>
        </div>

        <form id="registrationForm" class="registration-form" novalidate>
            <div class="form-group">
                <label for="email" class="form-label">Электронная почта</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="example@mail.ru" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="name" class="form-label">Имя</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="Иван Иванов" required>
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="birthDate" class="form-label">Дата рождения</label>
                <input type="date" id="birthDate" name="birthDate" class="form-input" required>
                <div class="error-message" id="birthDateError"></div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Минимум 6 символов" required minlength="6">
                <div class="error-message" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Введите пароль еще раз" required>
                <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <button type="submit" class="btn-register">Зарегистрироваться</button>

            <div class="login-link">
                Уже есть аккаунт? <a href="/auth/login" class="login-link-text">Войдите</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/registration.js}"></script>

</body>
</html>
