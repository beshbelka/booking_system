<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Купить билет - Кинозал</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/seances.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="buy-container">
    <!-- Верхняя часть с фильмом -->
    <section class="movie-hero"
             th:style="'background-image: linear-gradient(90deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0.2) 100%), url(' + ${movie.backdropUrl} + ');'">
        <div class="movie-hero-content">
            <div class="movie-poster-large">
                <img th:src="@{{path}(path=${movie.posterUrl})}"
                     th:alt="${movie.title} + ' постер'"
                     alt="Постер фильма">
            </div>
            <div class="movie-details">
                <h1 class="movie-title" th:text="${movie.title}">Название фильма</h1>
                <div class="movie-meta-hero">
                    <span class="meta-item">⏱ <span th:text="${movie.getFormattedDuration()}">2 часа 46 мин</span></span>
                    <span class="meta-item">🎬 <span th:text="${movie.genre}">Фантастика</span></span>
                    <span class="meta-item age-rating" th:text="${movie.ageRating}">18+</span>
                </div>
                <p class="movie-description-hero" th:text="${movie.description}">Описание</p>
            </div>
        </div>
    </section>

    <!-- Нижняя часть с сеансами -->
    <section class="sessions-section">
        <div class="container">
            <h2 class="section-title">Выберите сеанс</h2>

            <div class="sessions-list" th:if="${not #lists.isEmpty(seances)}">
                <!-- Группируем сеансы по залам -->
                <div class="session-card" th:each="hallSeances : ${#lists.groupBy(seances, 'hall.id')}">
                    <div class="session-hall-info">
                        <span class="hall-name">🎥 Зал <span th:text="${hallSeances[0].hall.number}">3</span></span>
                        <span class="hall-type" th:text="${hallSeances[0].hall.type}">Обычный</span>
                    </div>
                    <div class="session-times">
                        <button class="time-btn"
                                th:each="seance : ${hallSeances}"
                                th:attr="onclick='selectSession(' + ${seance.id} + ')'">
                            <span th:text="${#temporals.format(seance.startTime, 'HH:mm')}">12:30</span>
                            <span class="price"><span th:text="${seance.price}">500</span> ₽</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Если сеансов нет -->
            <div class="no-sessions" th:unless="${not #lists.isEmpty(seances)}">
                <p>😕 Сеансов для этого фильма пока нет</p>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
