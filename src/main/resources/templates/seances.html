<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Купить билет - Кинозал</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/seances.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="buy-container">
    <!-- Верхняя часть с фильмом -->
    <section class="movie-hero"
             th:style="'background-image: linear-gradient(90deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0.2) 100%), url(' + ${movie.backdropUrl} + '); background-size: cover; background-position: center;'">
        <div class="movie-hero-content">
            <div class="movie-poster-large">
                <img th:src="${movie.posterUrl}" th:alt="${movie.title}" alt="Постер">
            </div>
            <div class="movie-details">
                <h1 class="movie-title" th:text="${movie.title}">Название фильма</h1>
                <div class="movie-meta-hero">
                    <span class="meta-item">⏱ <span th:text="${movie.getFormattedDuration()}">2ч 46мин</span></span>
                    <span class="meta-item">🎬 <span th:text="${movie.genre}">Фантастика</span></span>
                    <span class="meta-item age-rating" th:text="${movie.ageRating}">18+</span>
                </div>
                <p class="movie-description-hero" th:text="${movie.description}">Описание</p>
            </div>
        </div>
    </section>

    <!-- Нижняя часть с сеансами -->
    <section class="sessions-section">
        <div class="container">
            <h2 class="section-title">Выберите сеанс</h2>

            <!-- Сеансы идут подряд, каждый в большом квадрате -->
            <div class="sessions-grid">
                <div class="session-card" th:each="seance : ${seances}">
                    <div class="session-time-large" th:text="${#temporals.format(seance.start_time, 'HH:mm')}">
                        12:30
                    </div>
                    <div class="session-end-time" th:text="${#temporals.format(seance.end_time, 'HH:mm')}">
                        Окончание: 14:30
                    </div>
                    <div class="session-hall">Зал <span th:text="${seance.hall.id}">1</span></div>
                    <button class="btn-select-session"
                            th:attr="onclick='selectSession(' + ${movie.id} + ', ' + ${seance.id} + ')'">
                        Выбрать
                    </button>
                </div>
            </div>

            <!-- Если сеансов нет -->
            <div class="no-sessions" th:unless="${not #lists.isEmpty(seances)}">
                <p>Сеансов для этого фильма пока нет</p>
            </div>
        </div>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    function selectSession(movieId, seanceId) {
        window.location.href = '/seats?seanceId=' + seanceId;
    }
</script>

</body>
</html>
