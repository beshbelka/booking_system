<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление сеансами - Кинозал</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <link rel="stylesheet" href="/css/control-seances.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="admin-container">
    <a href="/admin/control" class="back-link">← Назад</a>

    <div class="admin-header">
        <h1>Управление сеансами</h1>
        <p class="admin-subtitle">Поиск и управление сеансами</p>
    </div>

    <!-- Форма фильтрации -->
    <div class="filter-form">
        <div class="filter-group">
            <label for="filmSelect">Фильм</label>
            <select id="filmSelect" class="form-select">
                <option value="0">Все фильмы</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="hallSelect">Зал</label>
            <select id="hallSelect" class="form-select">
                <option value="0">Все залы</option>
            </select>
        </div>

        <button class="btn-find" id="findSeancesBtn">Найти</button>
    </div>

    <!-- Заголовок результатов -->
    <div class="results-header">
        <span class="results-count" id="resultsCount">Найдено сеансов: 0</span>
        <a href="/admin/control-seances-add" class="btn-add">+ Добавить сеанс</a>
    </div>

    <!-- Таблица с сеансами -->
    <div class="table-wrapper">
        <table class="seances-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Начало</th>
                <th>Конец</th>
                <th>Статус</th>
                <th>Всего мест</th>
                <th>Забронировано</th>
                <th>Свободно</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody id="seancesTableBody">
            <tr class="empty-row">
                <td colspan="8">
                    <div class="empty-state">
                        <h3>Нет сеансов</h3>
                        <p>Выберите фильм и зал, чтобы найти сеансы.</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Модальное окно редактирования -->
<div id="editModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Редактирование сеанса</h2>
            <span class="modal-close" onclick="closeEditModal()">&times;</span>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editSeanceId">
            <div class="form-group">
                <label for="editStartTime">Новое время начала</label>
                <input type="time" id="editStartTime" class="form-control" required>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeEditModal()">Отмена</button>
            <button class="btn-save" onclick="saveEditSeance()">Сохранить</button>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/control-seances.js}"></script>
</body>
</html>
