<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор места - Кинозал</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/seats.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="seats-container">
    <div class="seats-card">
        <h1 class="seats-title">Выбор места</h1>

        <!-- Информация о сеансе -->
        <div class="session-info">
            <h2 class="movie-title-display" th:text="${movie.title}">Название фильма</h2>
            <div class="session-time-display">
                Начало: <span th:text="${#temporals.format(seance.start_time, 'HH:mm')}">19:00</span>
                Окончание: <span th:text="${#temporals.format(seance.end_time, 'HH:mm')}">21:46</span>
            </div>
            Зал <div class="session-hall-display" th:text="${seance.hall.id}">1</div>
        </div>

        <!-- Схема зала -->
        <div class="seat-selection">
            <div class="hall-scheme" id="hallScheme">
                <!-- Схема зала будет генерироваться JS -->
            </div>
        </div>

        <!-- Информация о выбранном месте -->
        <div class="selected-seat-info" id="selectedSeatInfo">
            <span id="selectedSeatDisplay">Место не выбрано</span>
        </div>

        <!-- Кнопки действий -->
        <div class="action-buttons">
            <button class="btn-pay" id="payButton" onclick="payTicket()" disabled>Продолжить</button>
            <button class="btn-cancel" onclick="cancelBooking()">✕ Отменить</button>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/seats.js}"></script>

</body>
</html>
